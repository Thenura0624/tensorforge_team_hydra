services:
  api:
    build: .
    image: team-hydra-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      API_KEY: "${API_KEY:?Set the assigned API_KEY in the deployment environment}"
    volumes:
      - hydra-jobs:/service/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 120s
      retries: 3
volumes:
  hydra-jobs:
